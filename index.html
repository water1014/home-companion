<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0f" />
<meta name="description" content="一个只属于两个人的房间。" />
<title>小满 · 同居日志</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<div class="app" id="app">

  <header class="topbar">
    <div class="avatar" id="avatar" aria-hidden="true">
      <span class="avatar-ring"></span>
      <span class="avatar-core"></span>
      <span class="avatar-pulse"></span>
    </div>
    <div class="who">
      <div class="name-line">
        <h1 class="name" id="herName">小满</h1>
        <span class="tag">家机</span>
      </div>
      <p class="status" id="statusLine">正在启动…</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnPanel" aria-label="她的状态与记忆" title="她的状态">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.2"/><path d="M12 8.4v.2M12 11.6v4"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h9M17 17h3"/>
          <circle cx="16" cy="7" r="1.8"/><circle cx="10" cy="12" r="1.8"/><circle cx="15" cy="17" r="1.8"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="stream" id="stream" role="log" aria-live="polite" aria-relevant="additions text"></main>

  <div class="composer-wrap">
    <div class="quick" id="quick"></div>
    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="input">对她说点什么</label>
      <textarea id="input" rows="1" placeholder="说点什么…" maxlength="1200"></textarea>
      <button type="submit" class="send" id="send" aria-label="发送">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12h14M12.5 6l6 6-6 6"/>
        </svg>
      </button>
    </form>
  </div>
</div>

<!-- 侧面板：状态 / 记忆 -->
<aside class="panel" id="panel" aria-hidden="true" aria-label="她的状态与记忆">
  <div class="panel-inner">
    <div class="panel-head">
      <span class="eyebrow">此刻</span>
      <button class="icon-btn small" id="btnClosePanel" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="mood-block">
      <p class="mood-word" id="moodWord">平静</p>
      <p class="mood-sub" id="moodSub">像一杯放凉了的茶</p>
    </div>

    <div class="meters">
      <div class="meter">
        <div class="meter-top"><span>心情</span><span class="meter-val" id="vMood">62</span></div>
        <div class="bar"><i id="bMood"></i></div>
      </div>
      <div class="meter">
        <div class="meter-top"><span>精力</span><span class="meter-val" id="vEnergy">48</span></div>
        <div class="bar"><i id="bEnergy"></i></div>
      </div>
      <div class="meter">
        <div class="meter-top"><span>亲密度</span><span class="meter-val" id="vAffection">12</span></div>
        <div class="bar accent"><i id="bAffection"></i></div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-head"><span class="eyebrow">她记得的事</span>
        <button class="text-btn" id="btnAddMemory">添加</button>
      </div>
      <ul class="memories" id="memories"></ul>
      <p class="hint" id="memoryHint" hidden>还没有。告诉她一件你希望她记住的事。</p>
    </div>

    <div class="panel-section">
      <div class="panel-head"><span class="eyebrow">一起走过</span></div>
      <p class="counter"><span id="daysCount">0</span> 天</p>
      <p class="hint" id="sinceDate"></p>
    </div>
  </div>
</aside>

<!-- 设置 -->
<div class="sheet" id="settings" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet-inner">
    <div class="panel-head">
      <span class="eyebrow" id="settingsTitle">设置</span>
      <button class="icon-btn small" id="btnCloseSettings" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <section class="field-group">
      <label class="field">
        <span class="field-label">你的称呼</span>
        <input type="text" id="setUserName" placeholder="她该怎么叫你" maxlength="20" />
      </label>
      <label class="field">
        <span class="field-label">她的名字</span>
        <input type="text" id="setHerName" placeholder="小满" maxlength="12" />
      </label>
      <label class="field">
        <span class="field-label">从哪天开始</span>
        <input type="date" id="setStartDate" />
      </label>
    </section>

    <section class="field-group">
      <div class="switch-row">
        <div>
          <p class="field-label">接入大模型（可选）</p>
          <p class="hint">不填也能用。填了之后回复由模型生成，失败会自动退回本地人格引擎。</p>
        </div>
        <button class="switch" id="toggleLLM" role="switch" aria-checked="false"><i></i></button>
      </div>
      <label class="field">
        <span class="field-label">接口地址</span>
        <input type="url" id="setApiBase" placeholder="https://api.openai.com/v1" />
      </label>
      <label class="field">
        <span class="field-label">模型</span>
        <input type="text" id="setModel" placeholder="gpt-4o-mini" />
      </label>
      <label class="field">
        <span class="field-label">API Key</span>
        <input type="password" id="setApiKey" placeholder="sk-…" />
      </label>
      <p class="warn">密钥只存在这台设备的浏览器里，不会上传到任何地方。但如果你在共用设备上打开，请用完清掉。</p>
    </section>

    <section class="field-group">
      <div class="btn-row">
        <button class="ghost-btn" id="btnExport">导出记录</button>
        <button class="ghost-btn" id="btnImport">导入记录</button>
      </div>
      <button class="danger-btn" id="btnReset">清空所有数据</button>
    </section>

    <p class="footnote">本地优先 · 无服务器 · 数据只在你手里</p>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" hidden />

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/persona.js"></script>
<script src="js/llm.js"></script>
<script src="js/app.js"></script>
</body>
</html>
